<form class="search {% if large %}search--large{% endif %}" action="{% url 'roadmap_list' %}" method="get" role="search" data-search data-api="{% url 'api_search' %}" data-contribute="{% url 'contribute' %}" autocomplete="off">
  <div class="search-field">
    <input type="search" name="q" value="{{ q|default:'' }}" placeholder="What do you want to learn?" aria-label="Search roadmaps" role="combobox" aria-expanded="false" aria-controls="suggest-list" aria-autocomplete="list">
    <button type="submit">Search</button>
  </div>
  <ul class="suggest" id="suggest-list" role="listbox" hidden></ul>
</form>
